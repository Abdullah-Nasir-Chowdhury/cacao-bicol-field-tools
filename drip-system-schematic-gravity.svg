<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Water path from a gravity-fed source through a check valve, filter and pressure regulator, into a mainline that splits into three irrigation zones and out to the trees, with a rainwater tank merging in as dry-season backup.">
  <rect x="0" y="0" width="800" height="300" fill="#FFFFFF"></rect>
  <rect x="4" y="4" width="792" height="292" fill="none" stroke="#C7D0C4" stroke-width="1.5"></rect>

  <text x="20" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#1B2320">Drip System Schematic</text>
  <text x="20" y="49" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#56645C">Gravity-fed source &#8212; P&amp;ID convention</text>

  <!-- source -->
  <g transform="translate(20,132) scale(0.9)">
    <circle cx="20" cy="20" r="16" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></circle>
    <path d="M10,22 q5,-6 10,0 t10,0" fill="none" stroke="#56645C" stroke-width="1.6"></path>
    <path d="M10,16 q5,-6 10,0 t10,0" fill="none" stroke="#56645C" stroke-width="1.6"></path>
  </g>
  <text x="38" y="182" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1B2320">source</text>

  <!-- gravity segment -->
  <line x1="56" y1="150" x2="166" y2="150" stroke="#86928A" stroke-width="2.5"></line>
  <polygon points="166,150 158,145.5 158,154.5" fill="#86928A"></polygon>
  <path d="M96,150 L104,134" stroke="#4B7A3B" stroke-width="2" fill="none"></path>
  <polygon points="104,134 96.8,138.4 102.4,140.9" fill="#4B7A3B"></polygon>
  <text x="112" y="128" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="middle" fill="#4B7A3B">elevation assist</text>

  <!-- check valve -->
  <g transform="translate(166,132) scale(0.85,0.9)">
    <polygon points="6,10 20,20 6,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <polygon points="34,10 20,20 34,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="20" y1="8" x2="20" y2="32" stroke="#86928A" stroke-width="1.6"></line>
  </g>
  <text x="183" y="182" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">check valve</text>
  <line x1="200" y1="150" x2="236" y2="150" stroke="#86928A" stroke-width="2.5"></line>

  <!-- filter -->
  <g transform="translate(236,132) scale(0.85,0.9)">
    <polygon points="8,10 32,10 22,30 18,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="12" y1="16" x2="26" y2="16" stroke="#56645C" stroke-width="1.3"></line>
    <line x1="14" y1="21" x2="24" y2="21" stroke="#56645C" stroke-width="1.3"></line>
  </g>
  <text x="253" y="182" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">filter</text>
  <line x1="270" y1="150" x2="306" y2="150" stroke="#86928A" stroke-width="2.5"></line>

  <!-- regulator -->
  <g transform="translate(306,132) scale(0.85,0.9)">
    <polygon points="6,14 20,24 6,34" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <polygon points="34,14 20,24 34,34" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="20" y1="24" x2="20" y2="10" stroke="#56645C" stroke-width="1.6"></line>
    <path d="M14,10 q6,-6 12,0" fill="none" stroke="#56645C" stroke-width="1.6"></path>
  </g>
  <text x="323" y="182" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">regulator</text>
  <line x1="340" y1="150" x2="386" y2="150" stroke="#86928A" stroke-width="2.5"></line>
  <polygon points="386,150 378,145.5 378,154.5" fill="#86928A"></polygon>

  <!-- instruments -->
  <circle cx="369" cy="109" r="13" fill="#FFFFFF" stroke="#56645C" stroke-width="1.4"></circle>
  <text x="369" y="113" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1B2320">F</text>
  <line x1="369" y1="122" x2="369" y2="142" stroke="#86928A" stroke-width="1.5" stroke-dasharray="2 2"></line>

  <circle cx="399" cy="173" r="13" fill="#FFFFFF" stroke="#56645C" stroke-width="1.4"></circle>
  <text x="399" y="177" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1B2320">P</text>
  <line x1="399" y1="150" x2="399" y2="160" stroke="#86928A" stroke-width="1.5" stroke-dasharray="2 2"></line>

  <!-- mainline junction -->
  <circle cx="430" cy="150" r="4" fill="#86928A"></circle>
  <text x="430" y="182" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">mainline</text>

  <!-- zone branches -->
  <line x1="430" y1="150" x2="430" y2="65" stroke="#86928A" stroke-width="2.5"></line>
  <line x1="430" y1="150" x2="430" y2="235" stroke="#86928A" stroke-width="2.5"></line>
  <line x1="430" y1="65" x2="470" y2="65" stroke="#86928A" stroke-width="2.5"></line>
  <line x1="430" y1="150" x2="470" y2="150" stroke="#86928A" stroke-width="2.5"></line>
  <line x1="430" y1="235" x2="470" y2="235" stroke="#86928A" stroke-width="2.5"></line>

  <!-- zone 1 -->
  <g transform="translate(470,47) scale(0.75,0.85)">
    <polygon points="6,10 20,20 6,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <polygon points="34,10 20,20 34,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="20" y1="4" x2="20" y2="12" stroke="#56645C" stroke-width="2"></line>
    <line x1="12" y1="4" x2="28" y2="4" stroke="#56645C" stroke-width="2"></line>
  </g>
  <line x1="500" y1="65" x2="540" y2="65" stroke="#86928A" stroke-width="2.5"></line>
  <polygon points="540,65 532,60.5 532,69.5" fill="#86928A"></polygon>
  <text x="485" y="28" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">zone 1</text>
  <g transform="translate(545,44) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(580,44) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(615,44) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>

  <!-- zone 2 -->
  <g transform="translate(470,132) scale(0.75,0.85)">
    <polygon points="6,10 20,20 6,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <polygon points="34,10 20,20 34,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="20" y1="4" x2="20" y2="12" stroke="#56645C" stroke-width="2"></line>
    <line x1="12" y1="4" x2="28" y2="4" stroke="#56645C" stroke-width="2"></line>
  </g>
  <line x1="500" y1="150" x2="540" y2="150" stroke="#86928A" stroke-width="2.5"></line>
  <polygon points="540,150 532,145.5 532,154.5" fill="#86928A"></polygon>
  <text x="485" y="125" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">zone 2</text>
  <g transform="translate(545,129) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(580,129) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(615,129) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>

  <!-- zone 3 -->
  <g transform="translate(470,217) scale(0.75,0.85)">
    <polygon points="6,10 20,20 6,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <polygon points="34,10 20,20 34,30" fill="#E4E9E2" stroke="#86928A" stroke-width="1.6"></polygon>
    <line x1="20" y1="4" x2="20" y2="12" stroke="#56645C" stroke-width="2"></line>
    <line x1="12" y1="4" x2="28" y2="4" stroke="#56645C" stroke-width="2"></line>
  </g>
  <line x1="500" y1="235" x2="540" y2="235" stroke="#86928A" stroke-width="2.5"></line>
  <polygon points="540,235 532,230.5 532,239.5" fill="#86928A"></polygon>
  <text x="485" y="210" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#56645C">zone 3</text>
  <g transform="translate(545,214) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(580,214) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>
  <g transform="translate(615,214) scale(0.867,0.882)"><line x1="15" y1="34" x2="15" y2="20" stroke="#86928A" stroke-width="2"></line><circle cx="15" cy="12" r="11" fill="#4B7A3B" opacity="0.88"></circle></g>

  <!-- rainwater tank -->
  <rect x="140" y="210" width="40" height="34" fill="#DCEAE7" stroke="#16746C" stroke-width="1.6"></rect>
  <line x1="140" y1="222" x2="180" y2="222" stroke="#16746C" stroke-width="1.2"></line>
  <text x="160" y="206" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#0B403C">buffer tank</text>
  <path d="M160,210 L160,160 L166,160" stroke="#16746C" stroke-width="2.5" stroke-dasharray="4 3" fill="none"></path>
  <polygon points="166,160 158,157 158,163" fill="#16746C"></polygon>
  <text x="188" y="206" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#0B403C">dry-season</text>
  <text x="188" y="218" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle" fill="#0B403C">backup</text>

  <text x="690" y="28" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1B2320">trees</text>

  <text x="20" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#86928A">Gravity does the lifting for free &#8212; no pump in this configuration.</text>
</svg>
